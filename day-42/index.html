<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Ago</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Time Ago Calculator</h1>

    <div class="card">
        <h3>JavaScript Learning</h3>
        <p>Completed Day 40 JavaScript practice.</p>
        <small id="time1"></small>
    </div>

    <div class="card">
        <h3>New Project</h3>
        <p>Started building a new application.</p>
        <small id="time2"></small>
    </div>

    <div class="card">
        <h3>Recent Activity</h3>
        <p>Updated my GitHub repository.</p>
        <small id="time3"></small>
    </div>
    <input type="date" name="" id="dateInput"> <p id="dateOutput"></p>
    <br>
    <br>
    <button id="updateTimes">Update Times</button>
    <script src="script.js"></script>
</body>
</html>
